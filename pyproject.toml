[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leaderboard-rank-intervals"
version = "0.1.0"
description = "Rank intervals for leaderboards: a hierarchical framework for model evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "matplotlib",
    "seaborn",
    "tqdm",
    "datasets",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hierarchical_ranking*"]
